name: Update Lisboa promotional copy

on:
  push:
    paths:
      - '.github/workflows/update-promotional-copy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update promotional wording
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = {
              'index.html': {
                  'Seleção de materiais para experimentar + sorteio de um kit artístico no valor de 50 €': 'Seleção de materiais para experimentar + possibilidade de ganhar um kit artístico no valor de 50 €',
                  'NEWSLETTER + SORTEIO (OPCIONAL)': 'NEWSLETTER + KIT ARTÍSTICO (OPCIONAL)',
                  'NEWSLETTER + SORTEIO': 'NEWSLETTER + KIT ARTÍSTICO',
                  'Lembrete: ainda podes subscrever a newsletter e participar no sorteio.': 'Lembrete: ainda podes subscrever a newsletter e ter a possibilidade de ganhar um kit artístico no valor de 50 €.',
                  'Quero receber novidades, workshops e ofertas do Ramiro por email e participar no sorteio. Posso cancelar quando quiser.': 'Quero receber novidades, workshops e ofertas do Ramiro por email e ter a possibilidade de ganhar um kit artístico no valor de 50 €. Posso cancelar quando quiser.',
                  'Uso o teu email para a newsletter e o sorteio, com o teu consentimento.': 'Uso o teu email para a newsletter e para gerir esta participação, com o teu consentimento.',
                  'Para subscrever e entrar no sorteio, assinala primeiro a opção de consentimento.': 'Para subscrever e participar, assinala primeiro a opção de consentimento.',
                  'A selection of materials to try + a raffle for an art materials kit worth €50': 'A selection of materials to try + a chance to win an art materials kit worth €50',
                  'NEWSLETTER + RAFFLE (OPTIONAL)': 'NEWSLETTER + ART KIT (OPTIONAL)',
                  'NEWSLETTER + RAFFLE': 'NEWSLETTER + ART KIT',
                  'A quick reminder: you can still subscribe to the newsletter and enter the raffle.': 'A quick reminder: you can still subscribe to the newsletter and have a chance to win an art materials kit worth €50.',
                  'I’d like to receive Ramiro’s news, workshops and offers by email and enter the raffle. I can unsubscribe anytime.': 'I’d like to receive Ramiro’s news, workshops and offers by email and have a chance to win an art materials kit worth €50. I can unsubscribe anytime.',
                  'I use your email for the newsletter and raffle with your consent.': 'I use your email for the newsletter and to manage this participation, with your consent.',
                  'To subscribe and enter the raffle, please tick the consent option first.': 'To subscribe and participate, please tick the consent option first.',
              },
              'forms.js': {
                  'Quero receber novidades, workshops e ofertas do Ramiro por email e participar no sorteio. Posso cancelar quando quiser.': 'Quero receber novidades, workshops e ofertas do Ramiro por email e ter a possibilidade de ganhar um kit artístico no valor de 50 €. Posso cancelar quando quiser.',
                  'I’d like to receive Ramiro’s news, workshops and offers by email and enter the raffle. I can unsubscribe anytime.': 'I’d like to receive Ramiro’s news, workshops and offers by email and have a chance to win an art materials kit worth €50. I can unsubscribe anytime.',
                  "consentVersion: 'lisboa_newsletter_pt_v1'": "consentVersion: 'lisboa_newsletter_pt_v2'",
                  "consentVersion: 'lisboa_newsletter_en_v1'": "consentVersion: 'lisboa_newsletter_en_v2'",
              },
              'privacy.html': {
                  '<li><strong>Sorteio associado à newsletter:</strong> para gerir a participação indicada na página quando aplicável.</li>': '<li><strong>Participação promocional associada à newsletter:</strong> para gerir a possibilidade de atribuição de um kit artístico, quando aplicável.</li>',
                  '<li><strong>Newsletter raffle:</strong> to manage the participation described on the page when applicable.</li>': '<li><strong>Promotional participation linked to the newsletter:</strong> to manage the possibility of awarding an art materials kit, when applicable.</li>',
              },
          }

          changed = []
          for filename, replacements in files.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(filename)

          if not changed:
              raise SystemExit('No copy changes were made')
          print('Changed:', ', '.join(changed))
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html forms.js privacy.html
          git commit -m "Reframe Lisboa art kit promotion copy"
          git push
