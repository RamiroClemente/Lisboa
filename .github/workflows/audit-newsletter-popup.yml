name: Audit newsletter popup

on:
  push:
    paths:
      - '.github/workflows/audit-newsletter-popup.yml'

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract newsletter popup snippets
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          terms = [
              'lisboaSubscribed', 'inlineNewsletter', 'newsletter', 'popup',
              'modal', 'signup-form', 'signupForm', 'newsletterPopup',
              'newsletter-popup', 'subscribe', 'subscribed'
          ]
          out = []
          for term in terms:
              out.append(f'===== {term} =====')
              start = 0
              count = 0
              while True:
                  i = text.lower().find(term.lower(), start)
                  if i < 0:
                      break
                  count += 1
                  a = max(0, i - 900)
                  b = min(len(text), i + len(term) + 1400)
                  snippet = text[a:b].replace('\n', ' ')
                  out.append(f'-- occurrence {count} @ {i} --')
                  out.append(snippet)
                  start = i + len(term)
                  if count >= 20:
                      out.append('-- truncated after 20 occurrences --')
                      break
              if count == 0:
                  out.append('(none)')
          Path('newsletter-popup-audit.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add newsletter-popup-audit.txt
          git commit -m "Audit Lisboa newsletter popup state" || exit 0
          git push
