name: Patch Lisboa forms

on:
  push:
    paths:
      - '.github/workflows/patch-forms.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          replacements = {
            'Participa no sorteio de um kit de materiais no valor de 50 € e recebe a minha newsletter com novidades e ofertas dos meus eventos online e presenciais, e da minha loja online.': 'Quero receber novidades, workshops e ofertas do Ramiro por email e participar no sorteio. Posso cancelar quando quiser.',
            'Quero participar no sorteio de um kit de materiais no valor de 50 € e receber a minha newsletter com novidades e ofertas dos meus eventos (online e presenciais) e da minha loja online.': 'Quero receber novidades, workshops e ofertas do Ramiro por email e participar no sorteio. Posso cancelar quando quiser.',
            'Enter the raffle to win an art materials kit worth €50 and receive my newsletter with news and offers from my online and in-person events, and from my online shop.': 'I’d like to receive Ramiro’s news, workshops and offers by email and enter the raffle. I can unsubscribe anytime.',
            'Pré-visualização: a ligação ao teu serviço de newsletter será configurada na versão final.': 'Responsável: Ramiro Clemente · Uso o teu email para a newsletter e o sorteio, com o teu consentimento. Podes retirá-lo quando quiseres. <a href="privacy.html" target="_blank" rel="noopener" style="text-decoration:underline">Privacidade</a>.',
            'Preview: your newsletter service will be connected in the final version.': 'Controller: Ramiro Clemente · I use your email for the newsletter and raffle with your consent. You can withdraw it anytime. <a href="privacy.html" target="_blank" rel="noopener" style="text-decoration:underline">Privacy</a>.',
            'document.getElementById("contactForm").addEventListener("submit",e=>{e.preventDefault();showToast(tr("formToast"))});': '// Contact submission is handled securely by forms.js',
          }

          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)

          script = '<script src="forms.js" defer></script>'
          if script not in text:
              if '</body>' not in text:
                  raise SystemExit('Missing </body>')
              text = text.replace('</body>', script + '\n</body>')

          if text == original:
              raise SystemExit('No production changes were made')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect Lisboa forms to secure form service"
          git push
