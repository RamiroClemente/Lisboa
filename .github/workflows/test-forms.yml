name: Test Lisboa forms

on:
  push:
    paths:
      - '.github/workflows/test-forms.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test contact and newsletter
        run: |
          set -euo pipefail
          endpoint='https://vhtasjikqfldoilqdbhv.supabase.co/functions/v1/submit-form'
          origin='https://ramiroclemente.github.io'

          post() {
            payload="$1"
            response=$(curl -sS -w '\n%{http_code}' -X POST "$endpoint" \
              -H "Origin: $origin" \
              -H 'Content-Type: application/json' \
              --data "$payload")
            body=$(printf '%s' "$response" | sed '$d')
            code=$(printf '%s' "$response" | tail -n1)
            echo "HTTP $code $body"
            test "$code" = "200"
            echo "$body" | grep -q '"ok":true'
            echo "$body" | grep -q '"notification":true'
          }

          post '{"form_type":"contact","source_page":"https://ramiroclemente.github.io/Lisboa/","language":"pt","name":"Lisboa Test","email":"lisboa-contact-test@example.com","message":"Automated Lisboa contact test.","marketing_consent":false,"website":""}'
          post '{"form_type":"newsletter","source_page":"https://ramiroclemente.github.io/Lisboa/","language":"pt","email":"lisboa-newsletter-test@example.com","marketing_consent":true,"consent_version":"lisboa_newsletter_pt_v1","consent_text":"Quero receber novidades, workshops e ofertas do Ramiro por email e participar no sorteio. Posso cancelar quando quiser.","website":""}'
          post '{"form_type":"contact","source_page":"https://ramiroclemente.github.io/Lisboa/","language":"en","name":"Lisbon Consent Test","email":"lisboa-contact-consent-test@example.com","message":"Automated contact plus newsletter consent test.","marketing_consent":true,"consent_version":"lisboa_newsletter_en_v1","consent_text":"I’d like to receive Ramiro’s news, workshops and offers by email and enter the raffle. I can unsubscribe anytime.","website":""}'
