name: Audit Lisboa forms

on:
  push:
    paths:
      - '.github/workflows/audit-forms.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect forms and privacy-related code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('index.html').read_text(encoding='utf-8', errors='replace')
          print('SIZE', len(text))
          print('FORMS', len(re.findall(r'<form\b', text, re.I)))
          for term in ['formsubmit.co','mailto:','newsletter','consent','privacidade','privacy','contact','fetch(','localStorage','_honey','captcha']:
              print('TERM', term, 'COUNT', text.lower().count(term.lower()))

          patterns = [r'<form\b', r'formsubmit\.co', r'mailto:', r'newsletter', r'consent', r'privacidade', r'privacy', r'contact']
          seen=[]
          for pat in patterns:
              for m in re.finditer(pat, text, re.I):
                  start=max(0,m.start()-700); end=min(len(text),m.start()+1800)
                  key=(start,end)
                  if any(abs(start-s)<400 for s,e in seen):
                      continue
                  seen.append(key)
                  print('\n--- EXCERPT', pat, 'AT', m.start(), '---')
                  print(text[start:end].replace('\x00',''))
                  if len(seen)>=18:
                      break
              if len(seen)>=18:
                  break
          PY
