name: Update Lisboa demo workshop copy

on:
  push:
    paths:
      - '.github/workflows/update-demo-workshop-copy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update production copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []

          # INDEX
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          # Hero: remove city as the headline and make the format the attraction.
          text, hero_count = re.subn(
              r'(<h1[^>]*class=["\'][^"\']*hero-title[^"\']*["\'][^>]*>).*?(</h1>)',
              r'\1DEMO + WORKSHOP\2', text, count=1, flags=re.S|re.I
          )

          replacements = {
              # Hero/subtitle dictionaries
              'heroSub:"Começa primeiro.<br>Pensa depois."': 'heroSub:"Materiais para experimentar.<br>Uma surpresa no final."',
              'heroSub:"Start first.<br>Think later."': 'heroSub:"Materials to try.<br>A small surprise at the end."',

              # Top navigation: no city as headline/recruitment claim
              'Mixed Media Lab · 24 Oct · Lisbon': 'Mixed Media Lab · 24 Oct',
              'Mixed Media Lab · 24 Out · Lisboa': 'Mixed Media Lab · 24 Out',
              'Mixed Media Lab · 24 out · Lisboa': 'Mixed Media Lab · 24 out',
              'Mixed Media Lab · 24 Oct · Lisboa': 'Mixed Media Lab · 24 Oct',

              # Location: Lisboa only as quiet geographic context
              '<span>Atelier Vera Rebelo Pinto · Alfragide / Lisboa<br><a': '<span><span data-i18n="locationValue">Atelier Vera Rebelo Pinto · Alfragide · a poucos minutos de Lisboa</span><br><a',
              'localLabel:"LOCAL",maps:': 'localLabel:"LOCAL",locationValue:"Atelier Vera Rebelo Pinto · Alfragide · a poucos minutos de Lisboa",maps:',
              'localLabel:"LOCATION",maps:': 'localLabel:"LOCATION",locationValue:"Atelier Vera Rebelo Pinto · Alfragide · a few minutes from Lisbon",maps:',

              # Workshop value proposition: no prize, raffle or chance-to-win language
              'Seleção de materiais para experimentar + possibilidade de ganhar um kit artístico no valor de 50 €': 'Demo + workshop prático · materiais disponíveis para experimentar · uma pequena surpresa no final',
              'A selection of materials to try + a chance to win an art materials kit worth €50': 'Demo + hands-on workshop · materials available to try · a small surprise at the end',

              # Newsletter completely independent from any gift/promotion
              'NEWSLETTER + KIT ARTÍSTICO (OPCIONAL)': 'NEWSLETTER (OPCIONAL)',
              'NEWSLETTER + ART KIT (OPTIONAL)': 'NEWSLETTER (OPTIONAL)',
              'NEWSLETTER + KIT ARTÍSTICO': 'NEWSLETTER',
              'NEWSLETTER + ART KIT': 'NEWSLETTER',
              'Lembrete: ainda podes subscrever a newsletter e ter a possibilidade de ganhar um kit artístico no valor de 50 €.': 'Lembrete: ainda podes subscrever a newsletter para receber novidades sobre os próximos workshops.',
              'A quick reminder: you can still subscribe to the newsletter and have a chance to win an art materials kit worth €50.': 'A quick reminder: you can still subscribe to the newsletter for news about upcoming workshops.',
              'Quero receber novidades, workshops e ofertas do Ramiro por email e ter a possibilidade de ganhar um kit artístico no valor de 50 €. Posso cancelar quando quiser.': 'Quero receber novidades, workshops e ofertas do Ramiro por email. Posso cancelar quando quiser.',
              'I’d like to receive Ramiro’s news, workshops and offers by email and have a chance to win an art materials kit worth €50. I can unsubscribe anytime.': 'I’d like to receive Ramiro’s news, workshops and offers by email. I can unsubscribe anytime.',
              'Responsável: Ramiro Clemente · Uso o teu email para a newsletter e para gerir esta participação, com o teu consentimento.': 'Responsável: Ramiro Clemente · Uso o teu email para enviar a newsletter, com o teu consentimento.',
              'Controller: Ramiro Clemente · I use your email for the newsletter and to manage this participation, with your consent.': 'Controller: Ramiro Clemente · I use your email to send the newsletter, with your consent.',
              'Para subscrever e participar, assinala primeiro a opção de consentimento.': 'Para subscrever, assinala primeiro a opção de consentimento.',
              'To subscribe and participate, please tick the consent option first.': 'To subscribe, please tick the consent option first.',

              # Footer keeps the real venue area, not Lisboa as a banner claim
              'footerDate:"Lisboa · 24 outubro 2026"': 'footerDate:"Alfragide · 24 outubro 2026"',
              'footerDate:"Lisbon · October 24, 2026"': 'footerDate:"Alfragide · October 24, 2026"',
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          # If a dedicated material note exists, keep it experiential and non-promotional.
          text = re.sub(
              r'materialsNote:"[^"]*"',
              'materialsNote:"Os materiais estarão disponíveis durante o workshop para experimentar, combinar e testar livremente."',
              text
          )
          text = re.sub(
              r'materialNote:"[^"]*"',
              'materialNote:"Os materiais estarão disponíveis durante o workshop para experimentar, combinar e testar livremente."',
              text
          )
          text = re.sub(
              r'materialsNoteEn:"[^"]*"',
              'materialsNoteEn:"Materials will be available during the workshop to try, combine and explore freely."',
              text
          )

          if text != original:
              path.write_text(text, encoding='utf-8')
              changed.append('index.html')

          # FORMS
          path = Path('forms.js')
          text = path.read_text(encoding='utf-8')
          original = text
          form_replacements = {
              'Quero receber novidades, workshops e ofertas do Ramiro por email e ter a possibilidade de ganhar um kit artístico no valor de 50 €. Posso cancelar quando quiser.': 'Quero receber novidades, workshops e ofertas do Ramiro por email. Posso cancelar quando quiser.',
              'I’d like to receive Ramiro’s news, workshops and offers by email and have a chance to win an art materials kit worth €50. I can unsubscribe anytime.': 'I’d like to receive Ramiro’s news, workshops and offers by email. I can unsubscribe anytime.',
              "consentVersion: 'lisboa_newsletter_pt_v2'": "consentVersion: 'lisboa_newsletter_pt_v3'",
              "consentVersion: 'lisboa_newsletter_en_v2'": "consentVersion: 'lisboa_newsletter_en_v3'",
          }
          for old, new in form_replacements.items():
              text = text.replace(old, new)
          if text != original:
              path.write_text(text, encoding='utf-8')
              changed.append('forms.js')

          # PRIVACY: newsletter is now only a newsletter; remove promotion-specific purpose.
          path = Path('privacy.html')
          text = path.read_text(encoding='utf-8')
          original = text
          privacy_replacements = {
              '<li><strong>Participação promocional associada à newsletter:</strong> para gerir a possibilidade de atribuição de um kit artístico, quando aplicável.</li>': '',
              '<li><strong>Promotional participation linked to the newsletter:</strong> to manage the possibility of awarding an art materials kit, when applicable.</li>': '',
          }
          for old, new in privacy_replacements.items():
              text = text.replace(old, new)
          if text != original:
              path.write_text(text, encoding='utf-8')
              changed.append('privacy.html')

          if not changed:
              raise SystemExit('No production changes were made')
          print('Changed:', ', '.join(changed))
          print('Hero replacements:', hero_count)
          PY

      - name: Verify forbidden promotional wording is gone
        run: |
          python3 - <<'PY'
          from pathlib import Path
          joined = '\n'.join(Path(f).read_text(encoding='utf-8').lower() for f in ['index.html','forms.js','privacy.html'])
          forbidden = ['sorteio', 'raffle', 'chance to win', 'possibilidade de ganhar', 'kit artístico no valor de 50', 'art materials kit worth €50']
          found = [x for x in forbidden if x.lower() in joined]
          if found:
              raise SystemExit('Forbidden promotional wording remains: ' + ', '.join(found))
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html forms.js privacy.html
          git commit -m "Refocus Lisboa page on demo and workshop"
          git push
